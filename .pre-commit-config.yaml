repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
- repo: https://github.com/fastai/nbdev
  rev: 2.3.32
  hooks:
  - id: nbdev_clean
- repo: https://github.com/mwouts/jupytext
  rev: v1.16.4b
  hooks:
    - id: jupytext
      args: [--sync]